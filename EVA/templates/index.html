<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EVA — Emotion Voice Assistant</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(720px,100%);background:#1e293b;border:1px solid #334155;border-radius:20px;padding:32px;box-shadow:0 20px 60px #02061799}h1{margin:0 0 8px;font-size:32px}p{color:#94a3b8}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button,input{font:inherit}button{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:#38bdf8;color:#082f49;font-weight:700}button:disabled{opacity:.5;cursor:not-allowed}.result{display:none;margin-top:24px;padding:20px;border-radius:14px;background:#0f172a}.label{color:#94a3b8;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin-top:14px}.value{margin-top:5px;line-height:1.5}audio{width:100%;margin-top:18px}.status{margin-top:16px;color:#94a3b8;min-height:24px}@media(max-width:520px){.card{padding:22px}}
  </style>
</head>
<body>
<main class="card">
  <h1>🎙️ EVA</h1>
  <p>Emotion-aware voice assistant. Upload a short voice recording and let EVA analyze, respond, and speak back.</p>
  <input id="audio" type="file" accept="audio/*">
  <div class="controls"><button id="send">Process Voice</button></div>
  <div id="status" class="status"></div>
  <section id="result" class="result">
    <div class="label">You said</div><div id="text" class="value"></div>
    <div class="label">Detected emotion</div><div id="emotion" class="value"></div>
    <div class="label">EVA's response</div><div id="response" class="value"></div>
    <audio id="player" controls></audio>
  </section>
</main>
<script>
const input=document.getElementById('audio');
const send=document.getElementById('send');
const status=document.getElementById('status');
const result=document.getElementById('result');
const player=document.getElementById('player');

send.onclick=async()=>{
  if(!input.files.length){status.textContent='Please choose an audio file first.';return}
  send.disabled=true;
  status.textContent='Processing audio… The first request may take a little longer.';
  result.style.display='none';
  player.removeAttribute('src');
  try{
    const fd=new FormData();
    fd.append('audio',input.files[0]);
    const r=await fetch('/process',{method:'POST',body:fd});
    const raw=await r.text();
    let data;
    try{data=raw?JSON.parse(raw):null}catch(_){data=null}
    if(!r.ok){
      throw new Error(data?.error||`Server returned HTTP ${r.status}. Check the Render logs.`);
    }
    if(!data){
      throw new Error('The server returned an empty response. Check the Render logs.');
    }
    document.getElementById('text').textContent=data.text||'—';
    document.getElementById('emotion').textContent=data.emotion||'—';
    document.getElementById('response').textContent=data.response||'—';
    if(data.audio){
      player.src=data.audio;
      player.style.display='block';
    }else{
      player.style.display='none';
      if('speechSynthesis' in window && data.response){
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(data.response));
      }
    }
    result.style.display='block';
    status.textContent='Done — EVA has responded.';
  }catch(e){
    status.textContent=e.message||'Request failed.';
  }finally{
    send.disabled=false;
  }
};
</script>
</body>
</html>
